<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic-tac-toe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF1F8;
    --panel: #FFFFFF;
    --ink: #1B2140;
    --muted: #5B6485;
    --line: #C9D0E6;
    --x: #3346E8;
    --o: #E5407A;
    --win: #FFE27A;
    --hover: #F3F5FC;
    --focus: #1B2140;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12162B;
      --panel: #1B2140;
      --ink: #EEF1FF;
      --muted: #9AA3C7;
      --line: #333C66;
      --x: #8A97FF;
      --o: #FF7DA8;
      --win: #5A4E1E;
      --hover: #232A4E;
      --focus: #EEF1FF;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12162B;
    --panel: #1B2140;
    --ink: #EEF1FF;
    --muted: #9AA3C7;
    --line: #333C66;
    --x: #8A97FF;
    --o: #FF7DA8;
    --win: #5A4E1E;
    --hover: #232A4E;
    --focus: #EEF1FF;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 28px 16px 40px;
  }
  main { width: min(100%, 440px); }

  h1 {
    font-size: 2.1rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 18px;
  }

  /* Scoreboard */
  .scores {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 18px;
  }
  .score {
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 16px;
    padding: 10px 12px;
    transition: border-color .2s;
  }
  .score .n { font-size: 1.8rem; font-weight: 800; line-height: 1.1; }
  .score .l { font-size: .85rem; color: var(--muted); font-weight: 500; }
  .score.x .n { color: var(--x); }
  .score.o .n { color: var(--o); }
  .score.active.x { border-color: var(--x); }
  .score.active.o { border-color: var(--o); }

  .status {
    font-size: 1.15rem;
    font-weight: 700;
    min-height: 1.6em;
    margin: 0 0 12px;
  }

  /* Board */
  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    width: 100%;
  }
  .cell {
    aspect-ratio: 1;
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 20px;
    padding: 18%;
    cursor: pointer;
    display: grid;
    place-items: center;
    color: inherit;
    font: inherit;
    transition: background .15s, border-color .15s;
  }
  .cell:hover:not(:disabled):not(.filled) { background: var(--hover); border-color: var(--muted); }
  .cell:disabled { cursor: default; }
  .cell.filled { cursor: default; }
  .cell.win { background: var(--win); border-color: var(--win); }
  .cell:focus-visible, .btn:focus-visible, .seg button:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 3px;
  }
  .cell svg { width: 100%; height: 100%; overflow: visible; }
  .mark { fill: none; stroke-width: 13; stroke-linecap: round; }
  .mark.x { stroke: var(--x); }
  .mark.o { stroke: var(--o); }
  .draw {
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: draw .28s ease-out forwards;
  }
  .draw.second { animation-delay: .12s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* Controls */
  .controls { margin-top: 22px; display: grid; gap: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .row > .label { font-size: .9rem; color: var(--muted); font-weight: 500; min-width: 84px; }
  .seg {
    display: inline-flex;
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 999px;
    padding: 3px;
  }
  .seg button {
    font: inherit;
    font-weight: 700;
    font-size: .92rem;
    color: var(--muted);
    background: transparent;
    border: 0;
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .btn {
    font: inherit;
    font-weight: 700;
    font-size: .95rem;
    border-radius: 999px;
    padding: 10px 18px;
    cursor: pointer;
    border: 2px solid var(--ink);
    background: var(--ink);
    color: var(--bg);
  }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn.ghost:hover { border-color: var(--ink); }
  .btn.pulse { animation: pulse 1.2s ease-in-out 2; }
  @keyframes pulse { 50% { transform: scale(1.05); } }
  .hint { font-size: .85rem; color: var(--muted); margin: 6px 0 0; }
  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    .draw { animation: none; stroke-dashoffset: 0; }
    .btn.pulse { animation: none; }
    * { transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <h1>Tic-tac-toe</h1>

  <div class="scores" id="scores">
    <div class="score x" id="score-x"><div class="n" id="n-x">0</div><div class="l" id="l-x">You (X)</div></div>
    <div class="score" id="score-d"><div class="n" id="n-d">0</div><div class="l">Draws</div></div>
    <div class="score o" id="score-o"><div class="n" id="n-o">0</div><div class="l" id="l-o">Computer (O)</div></div>
  </div>

  <p class="status" id="status" aria-live="polite"></p>

  <div class="board" id="board" role="grid" aria-label="Tic-tac-toe board"></div>

  <div class="controls">
    <div class="row">
      <span class="label">Opponent</span>
      <div class="seg" id="mode-seg">
        <button type="button" data-mode="cpu" aria-pressed="true">Computer</button>
        <button type="button" data-mode="two" aria-pressed="false">Second player</button>
      </div>
    </div>
    <div class="row" id="level-row">
      <span class="label">Difficulty</span>
      <div class="seg" id="level-seg">
        <button type="button" data-level="easy" aria-pressed="false">Easy</button>
        <button type="button" data-level="hard" aria-pressed="true">Unbeatable</button>
      </div>
    </div>
    <div class="row">
      <button type="button" class="btn" id="new-round">New round</button>
      <button type="button" class="btn ghost" id="reset-scores">Reset scores</button>
    </div>
    <p class="hint">Tip: press keys 1–9 to place a mark. The player who didn't start the last round goes first next.</p>
  </div>
</main>

<script>
(function () {
  var LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  var boardEl = document.getElementById('board');
  var statusEl = document.getElementById('status');
  var newRoundBtn = document.getElementById('new-round');

  var state = {
    board: Array(9).fill(null),
    turn: 'X',
    starter: 'X',
    over: false,
    winLine: null,
    mode: 'cpu',      // 'cpu' | 'two'
    level: 'hard',    // 'easy' | 'hard'
    scores: { X: 0, O: 0, D: 0 },
    locked: false
  };
  var cpuTimer = null;

  /* ---------- Game logic ---------- */
  function findWinner(b) {
    for (var i = 0; i < LINES.length; i++) {
      var l = LINES[i];
      if (b[l[0]] && b[l[0]] === b[l[1]] && b[l[0]] === b[l[2]]) {
        return { mark: b[l[0]], line: l };
      }
    }
    return null;
  }
  function empties(b) {
    var out = [];
    for (var i = 0; i < 9; i++) if (!b[i]) out.push(i);
    return out;
  }
  // Computer is always O. Higher score is better for O.
  function minimax(b, turn, depth) {
    var w = findWinner(b);
    if (w) return w.mark === 'O' ? 10 - depth : depth - 10;
    var free = empties(b);
    if (!free.length) return 0;
    var best = turn === 'O' ? -Infinity : Infinity;
    for (var i = 0; i < free.length; i++) {
      b[free[i]] = turn;
      var s = minimax(b, turn === 'O' ? 'X' : 'O', depth + 1);
      b[free[i]] = null;
      best = turn === 'O' ? Math.max(best, s) : Math.min(best, s);
    }
    return best;
  }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function cpuChoose() {
    var b = state.board.slice();
    var free = empties(b);
    if (state.level === 'easy') return pick(free);
    if (free.length === 9) return pick([0, 2, 6, 8]);
    var bestScore = -Infinity, bestMoves = [];
    for (var i = 0; i < free.length; i++) {
      b[free[i]] = 'O';
      var s = minimax(b, 'X', 1);
      b[free[i]] = null;
      if (s > bestScore) { bestScore = s; bestMoves = [free[i]]; }
      else if (s === bestScore) bestMoves.push(free[i]);
    }
    return pick(bestMoves);
  }

  /* ---------- Flow ---------- */
  function scheduleCpu() {
    state.locked = true;
    clearTimeout(cpuTimer);
    cpuTimer = setTimeout(function () {
      state.locked = false;
      if (!state.over) place(cpuChoose());
    }, 480);
  }
  function place(i) {
    if (state.over || state.board[i]) return;
    state.board[i] = state.turn;
    var w = findWinner(state.board);
    if (w) {
      state.over = true;
      state.winLine = w.line;
      state.scores[w.mark]++;
    } else if (!empties(state.board).length) {
      state.over = true;
      state.scores.D++;
    } else {
      state.turn = state.turn === 'X' ? 'O' : 'X';
    }
    render(i);
    if (!state.over && state.mode === 'cpu' && state.turn === 'O') scheduleCpu();
  }
  function onCell(i) {
    if (state.over || state.locked || state.board[i]) return;
    if (state.mode === 'cpu' && state.turn === 'O') return;
    place(i);
  }
  function newRound() {
    clearTimeout(cpuTimer);
    if (state.over) state.starter = state.starter === 'X' ? 'O' : 'X';
    state.board = Array(9).fill(null);
    state.turn = state.starter;
    state.over = false;
    state.winLine = null;
    state.locked = false;
    render(-1);
    if (state.mode === 'cpu' && state.turn === 'O') scheduleCpu();
  }
  function resetAll() {
    clearTimeout(cpuTimer);
    state.scores = { X: 0, O: 0, D: 0 };
    state.starter = 'X';
    state.over = false;
    newRound();
  }

  /* ---------- Rendering ---------- */
  function markSvg(m, animate) {
    var cls = animate ? ' draw' : '';
    if (m === 'X') {
      return '<svg viewBox="0 0 100 100" aria-hidden="true">' +
        '<path class="mark x' + cls + '" pathLength="1" d="M18 18 L82 82"/>' +
        '<path class="mark x' + cls + ' second" pathLength="1" d="M82 18 L18 82"/></svg>';
    }
    return '<svg viewBox="0 0 100 100" aria-hidden="true">' +
      '<circle class="mark o' + cls + '" pathLength="1" cx="50" cy="50" r="32" transform="rotate(-90 50 50)"/></svg>';
  }
  function names() {
    return state.mode === 'cpu'
      ? { X: 'You', O: 'Computer' }
      : { X: 'Player X', O: 'Player O' };
  }
  function render(animatedIndex) {
    var nm = names();
    // cells
    var html = '';
    for (var i = 0; i < 9; i++) {
      var v = state.board[i];
      var isWin = state.winLine && state.winLine.indexOf(i) !== -1;
      var label = 'Square ' + (i + 1) + (v ? ', ' + v : ', empty');
      html += '<button type="button" class="cell' + (v ? ' filled' : '') + (isWin ? ' win' : '') + '"' +
        ' data-i="' + i + '" role="gridcell" aria-label="' + label + '"' +
        (state.over || v ? ' disabled' : '') + '>' +
        (v ? markSvg(v, i === animatedIndex) : '') + '</button>';
    }
    boardEl.innerHTML = html;

    // scores
    document.getElementById('n-x').textContent = state.scores.X;
    document.getElementById('n-o').textContent = state.scores.O;
    document.getElementById('n-d').textContent = state.scores.D;
    document.getElementById('l-x').textContent = state.mode === 'cpu' ? 'You (X)' : 'Player X';
    document.getElementById('l-o').textContent = state.mode === 'cpu' ? 'Computer (O)' : 'Player O';
    document.getElementById('score-x').classList.toggle('active', !state.over && state.turn === 'X');
    document.getElementById('score-o').classList.toggle('active', !state.over && state.turn === 'O');

    // status
    var w = state.winLine ? state.board[state.winLine[0]] : null;
    if (state.over) {
      if (w) {
        statusEl.textContent = (state.mode === 'cpu')
          ? (w === 'X' ? 'You win!' : 'Computer wins')
          : nm[w] + ' wins!';
      } else {
        statusEl.textContent = "It's a draw";
      }
    } else if (state.mode === 'cpu') {
      statusEl.textContent = state.turn === 'X' ? 'Your move' : 'Computer is thinking…';
    } else {
      statusEl.textContent = nm[state.turn] + "'s move";
    }

    newRoundBtn.textContent = state.over ? 'Play again' : 'New round';
    newRoundBtn.classList.toggle('pulse', state.over);

    // controls
    document.getElementById('level-row').hidden = state.mode !== 'cpu';
    Array.prototype.forEach.call(document.querySelectorAll('#mode-seg button'), function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-mode') === state.mode));
    });
    Array.prototype.forEach.call(document.querySelectorAll('#level-seg button'), function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-level') === state.level));
    });
  }

  /* ---------- Events ---------- */
  boardEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.cell');
    if (btn) onCell(Number(btn.getAttribute('data-i')));
  });
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key >= '1' && e.key <= '9') onCell(Number(e.key) - 1);
  });
  newRoundBtn.addEventListener('click', newRound);
  document.getElementById('reset-scores').addEventListener('click', resetAll);
  document.getElementById('mode-seg').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b || b.getAttribute('data-mode') === state.mode) return;
    state.mode = b.getAttribute('data-mode');
    resetAll();
  });
  document.getElementById('level-seg').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b || b.getAttribute('data-level') === state.level) return;
    state.level = b.getAttribute('data-level');
    resetAll();
  });

  render(-1);
})();
</script>
</body>
</html>
