<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DS Student Sign Up</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --text:#1c2333; --muted:#5f6b85;
  --border:#d5dbea; --accent:#4f46e5; --accent-text:#ffffff; --ok:#15803d;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111524; --card:#1a2036; --text:#e8ecf7; --muted:#9aa5c3;
    --border:#2e3756; --accent:#818cf8; --accent-text:#0f1226; --ok:#4ade80;
  }
}
:root[data-theme="dark"]{
  --bg:#111524; --card:#1a2036; --text:#e8ecf7; --muted:#9aa5c3;
  --border:#2e3756; --accent:#818cf8; --accent-text:#0f1226; --ok:#4ade80;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
}
.card{
  background:var(--card); width:100%; max-width:420px; padding:28px;
  border:1px solid var(--border); border-radius:14px;
}
h1{margin:0 0 4px; font-size:1.5rem}
.sub{margin:0 0 20px; color:var(--muted); font-size:.95rem}
label{display:block; margin:14px 0 6px; font-weight:600; font-size:.9rem}
input[type=text],input[type=email],input[type=password],select{
  width:100%; padding:10px 12px; font-size:1rem; color:var(--text);
  background:var(--bg); border:1px solid var(--border); border-radius:8px;
}
input:focus,select:focus{outline:2px solid var(--accent); border-color:transparent}
.checks{display:flex; flex-wrap:wrap; gap:8px 16px; margin-top:4px}
.checks label{display:flex; align-items:center; gap:6px; margin:0; font-weight:400}
button{
  width:100%; margin-top:22px; padding:12px; font-size:1rem; font-weight:600;
  background:var(--accent); color:var(--accent-text); border:0; border-radius:8px; cursor:pointer;
}
button:hover{opacity:.9}
.msg{margin-top:14px; font-size:.9rem; min-height:1.2em}
.msg.err{color:#dc2626} .msg.ok{color:var(--ok)}
</style>
</head>
<body>
  <main class="card">
    <h1>📊 DS Student Sign Up</h1>
    <p class="sub">Data Science · 2nd Year</p>

    <form id="signup" novalidate>
      <label for="name">Full name</label>
      <input type="text" id="name" placeholder="Your name" value="Arpita Pandey" required>

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" value="arpita707547@gmail.com" required>

      <label for="roll">Roll / Enrollment number</label>
      <input type="text" id="roll" placeholder="e.g. 45" value="45">

      <label for="year">Year</label>
      <select id="year">
        <option>1st Year</option>
        <option selected>2nd Year</option>
        <option>3rd Year</option>
        <option>4th Year</option>
      </select>

      <label>Interests</label>
      <div class="checks">
        <label><input type="checkbox" name="int" value="Python"> Python</label>
        <label><input type="checkbox" name="int" value="Statistics"> Statistics</label>
        <label><input type="checkbox" name="int" value="Machine Learning"> Machine Learning</label>
        <label><input type="checkbox" name="int" value="SQL"> SQL</label>
      </div>

      <label for="pw">Password</label>
      <input type="password" id="pw" placeholder="At least 8 characters" required>

      <label for="pw2">Confirm password</label>
      <input type="password" id="pw2" placeholder="Repeat password" required>

      <button type="submit">Sign Up</button>
      <div class="msg" id="msg" role="status"></div>
    </form>
  </main>

<script>
  const form = document.getElementById('signup');
  const msg = document.getElementById('msg');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const pw = document.getElementById('pw').value;
    const pw2 = document.getElementById('pw2').value;

    msg.className = 'msg err';
    if (!name) { msg.textContent = 'Please enter your name.'; return; }
    if (!/^\S+@\S+\.\S+$/.test(email)) { msg.textContent = 'Please enter a valid email.'; return; }
    if (pw.length < 8) { msg.textContent = 'Password must be at least 8 characters.'; return; }
    if (pw !== pw2) { msg.textContent = 'Passwords do not match.'; return; }

    msg.className = 'msg ok';
    msg.textContent = 'Welcome, ' + name + '! Your sign up is complete. 🎉';
    form.reset();
    document.getElementById('year').value = '2nd Year';
  });
</script>
</body>
</html>
